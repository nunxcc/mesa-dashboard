<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa — restaurant operations dashboard</title>
    <meta
      name="description"
      content="Operations dashboard for a restaurant: revenue, service times, menu margins and what the delivery platforms actually cost."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Applies the stored theme before first paint. Without this the page renders
      light, then flips to dark once React mounts — the flash of wrong theme
      that no amount of CSS can fix, because the preference lives in storage
      that only JavaScript can read.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mesa.theme');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
